# Run with: sudo -v && ansible-playbook macos.yml --ask-become-pass
# The geerlingguy roles escalate their own tasks (task-level become overrides
# the play's become: false); --ask-become-pass collects the password once
# instead of sudo prompting per task, and `sudo -v` pre-caches the timestamp
# for the pkg-based casks that call sudo internally (virtualbox, mactex, ...).
# TODO: tag-scope the geerlingguy.mac.homebrew import as `bootstrap` so
# steady-state runs skip its sudo tasks (chowns etc.) and need no password.
- hosts: localhost
  tags: macos
  gather_facts: true
  become: false  # Default to no sudo for macos

  # geerlingguy's role installs brew but never puts it on PATH: its tasks
  # (and ours) inherit the launching shell's PATH, where /opt/homebrew/bin
  # is missing on a fresh machine. Prepend it for the whole play.
  # ponytail: Apple Silicon prefix only; add /usr/local if an Intel Mac ever joins.
  environment:
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:{{ lookup('env', 'PATH') }}"

  roles:
    # Installs Homebrew itself if missing. Must run before the macos role,
    # which installs apps with the plain homebrew modules.
    - role: geerlingguy.mac.homebrew
      tags: [homebrew]
    - macos
    - common
    # Mac App Store apps; there is no plain mas module, so this stays a role.
    - role: geerlingguy.mac.mas
      vars:
        mas_uninstalled_apps: []
        mas_installed_app_ids:
          - 497799835 # Xcode (Free)
          - 1410709951 # Smart Countdown Timer (Free)
          - 1120214373 # Battery Health 2: Stats & Info (Free)
          - 1395414535 # TaskTab: Simple To Do List (Free)
          - 441258766 # Magnet (Paid, now: $4.99, I think I paid 2.99 or something)
      tags: [mas]
