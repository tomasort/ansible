- hosts: localhost
  tags: macos
  gather_facts: true
  become: false  # Default to no sudo for macos

  roles:
    # Installs Homebrew itself if missing. Must run before the macos role,
    # which installs apps with the plain homebrew modules.
    - role: geerlingguy.mac.homebrew
      tags: [homebrew]
    - macos
    - common
    # Mac App Store apps; there is no plain mas module, so this stays a role.
    - role: geerlingguy.mac.mas
      vars:
        mas_uninstalled_apps: []
        mas_installed_app_ids:
          - 497799835 # Xcode (Free)
          - 1410709951 # Smart Countdown Timer (Free)
          - 1120214373 # Battery Health 2: Stats & Info (Free)
          - 1395414535 # TaskTab: Simple To Do List (Free)
          - 441258766 # Magnet (Paid, now: $4.99, I think I paid 2.99 or something)
      tags: [mas]
