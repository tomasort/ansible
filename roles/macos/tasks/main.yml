---
# tasks file for macos
#
# Install reattach-to-user-namespace using brew

- name: Import settings tasks
  ansible.builtin.import_tasks: "settings.yml"

# homebrew.yml runs after the geerlingguy.mac.homebrew role in macos.yml,
# which is what installs brew itself on a fresh machine.
- name: Import homebrew tasks
  ansible.builtin.import_tasks: "homebrew.yml"

- name: Import aerospace tasks
  ansible.builtin.import_tasks: "aerospace.yml"

- name: Import terminal tasks
  ansible.builtin.import_tasks: "terminal.yml"

- name: Import karabiner tasks
  ansible.builtin.import_tasks: "karabiner.yml"

