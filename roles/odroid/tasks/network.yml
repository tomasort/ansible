---
# NetworkManager WiFi connection management for the odroid wlan0 dongle.
- name: Ensure Network Manager is installed.
  package:
    name: network-manager
    state: present
  become: true
  tags: [wifi]

- name: Start and enable NetworkManager service
  systemd:
    name: NetworkManager
    state: started
    enabled: true
  become: true
  tags: [wifi]

- name: Disable WiFi power save in NetworkManager
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf
    content: |
      [connection]
      wifi.powersave = 2
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload NetworkManager configuration
  tags: [wifi]

