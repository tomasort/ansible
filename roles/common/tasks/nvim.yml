---
# Tasks to install neovim

- name: Check if nvim is already installed
  ansible.builtin.command:
    argv:
      - sh
      - -lc
      - command -v nvim
  register: nvim_installed
  changed_when: false
  failed_when: false

- name: Clone Neovim stable branch
  ansible.builtin.git:
    repo: "https://github.com/neovim/neovim.git"
    dest: "/tmp/neovim"
    version: stable
  when: nvim_installed.rc != 0

- name: Install nvim build dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  become: true
  loop: "{{ ('ninja-build gettext cmake curl build-essential' if ansible_os_family != 'Darwin' else 'ninja gettext cmake curl') | split }}"
  when: nvim_installed.rc != 0

- name: Build nvim
  community.general.make:
    chdir: /tmp/neovim
    params:
      CMAKE_BUILD_TYPE: RelWithDebInfo
  when: nvim_installed.rc != 0

- name: Install nvim
  become: true
  community.general.make:
    chdir: /tmp/neovim
    target: install
  when: nvim_installed.rc != 0

- name: Check for Neovim init.lua
  ansible.builtin.stat:
    path: "{{ [home, '.config/nvim/init.lua'] | path_join }}"
  register: nvim_config

- name: Fail if the Neovim config was not stowed
  ansible.builtin.fail:
    msg: "Expected {{ [home, '.config/nvim/init.lua'] | path_join }} to exist before bootstrapping plugins. Make sure the dotfiles task runs first."
  when: not nvim_config.stat.exists

- name: Remove legacy vim-plug bootstrap file
  ansible.builtin.file:
    path: "{{ [home, '.local/share/nvim/site/autoload/plug.vim'] | path_join }}"
    state: absent

- name: Bootstrap lazy.nvim plugins
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - -u
      - "{{ [home, '.config/nvim/init.lua'] | path_join }}"
      - +Lazy! sync
      - +qall
  environment:
    HOME: "{{ home }}"
  register: lazy_sync
  changed_when: true

- name: Install Mason-managed tools
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - -u
      - "{{ [home, '.config/nvim/init.lua'] | path_join }}"
      - +MasonToolsInstallSync
      - +qall
  environment:
    HOME: "{{ home }}"
  register: mason_tools
  changed_when: true

# TODO: set the variable GITHUB_COPILOT_TOKEN or GH_COPILOT_TOKEN in the environment to the github token

# nvim-treesitter (main branch, nvim 0.12+) requires tree-sitter-cli >= 0.26.1
# from a system install (NOT npm) plus tar, curl and a C compiler in PATH.
# gcc/build-essential already installed by the nvim build-deps task above.
# Install method: official GitHub release binary in ~/.local/bin — identical on
# macOS and Linux, no apt/brew involved. Skips if any tree-sitter is already on
# PATH (e.g. this Mac's brew install).

- name: Gather facts (needed when this block runs as a tagged subset)
  ansible.builtin.setup:
  tags: [treesitter]

- name: Check if tree-sitter CLI is already on PATH
  ansible.builtin.command:
    argv:
      - sh
      - -lc
      - command -v tree-sitter
  register: tree_sitter_check
  changed_when: false
  failed_when: false
  tags: [treesitter]

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ [home, '.local/bin'] | path_join }}"
    state: directory
    mode: "0755"
  when: tree_sitter_check.rc != 0
  tags: [treesitter]

- name: Download tree-sitter CLI (latest stable GitHub release, all platforms)
  ansible.builtin.get_url:
    url: "https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-{{ 'macos' if ansible_system == 'Darwin' else 'linux' }}-{{ 'arm64' if ansible_architecture == 'aarch64' else 'x64' }}.gz"
    dest: "{{ [home, '.local/bin/tree-sitter.gz'] | path_join }}"
    mode: "0644"
  when: tree_sitter_check.rc != 0
  register: tree_sitter_download
  tags: [treesitter]

- name: Check if the tree-sitter binary is already in place
  ansible.builtin.stat:
    path: "{{ [home, '.local/bin/tree-sitter'] | path_join }}"
  register: ts_binary
  when: tree_sitter_check.rc != 0
  tags: [treesitter]

- name: Decompress tree-sitter binary
  ansible.builtin.command:
    argv:
      - gunzip
      - -f
      - "{{ [home, '.local/bin/tree-sitter.gz'] | path_join }}"
  when: tree_sitter_check.rc != 0 and not ts_binary.stat.exists
  register: ts_unzip
  changed_when: true
  tags: [treesitter]

- name: Set executable bit on tree-sitter binary
  ansible.builtin.file:
    path: "{{ [home, '.local/bin/tree-sitter'] | path_join }}"
    mode: "0755"
  when: ts_unzip.changed | default(false)
  tags: [treesitter]
