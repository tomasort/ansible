# Git configuration

- name: Gather facts (needed for tag-scoped runs)
  ansible.builtin.setup:
  tags: [git, minimal]

- name: Ensure git is installed.
  package:
    name: git
    state: present
  become: "{{ ansible_os_family != 'Darwin' }}"

- name: Git personal setup email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ email }}"

- name: Git personal setup name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_name }}"

- name: Set Git color UI to auto
  community.general.git_config:
    name: color.ui
    scope: global
    value: auto

- name: Enable rerere in git
  community.general.git_config:
    name: rerere.enabled
    scope: global
    value: true

# We could even set up github here with gh
- name: Make sure gh is installed
  package:
    name: gh
    state: present
  become: "{{ ansible_os_family != 'Darwin' }}"

- name: Authenticate on Github
  # token via stdin — keeps it out of argv/process listings.
  # env -u clears GITHUB_TOKEN/GH_TOKEN from the child environment: gh refuses
  # to STORE credentials while a token env var is present (env-only mode),
  # and the machine shell legitimately exports GITHUB_TOKEN for other tools
  # (opencode, api calls) — it must not dictate gh's auth mode here.
  ansible.builtin.shell:
    cmd: env -u GITHUB_TOKEN -u GH_TOKEN gh auth login --git-protocol ssh --with-token
    stdin: "{{ github_token }}"
