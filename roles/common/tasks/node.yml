#   args:
#     creates: "{{ home }}/.nvm/nvm.sh"

- name: Download NVM installation script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh"
    dest: "/tmp/nvm-install.sh"
    mode: "0755"

- name: Run NVM installation script
  ansible.builtin.command:
    cmd: "/bin/bash /tmp/nvm-install.sh"
  args:
    creates: "{{ home }}/.nvm/nvm.sh"

- name: Check for installed Node {{ node_major }} (pinned major)
  ansible.builtin.find:
    paths: "{{ home }}/.nvm/versions/node/"
    patterns: "v{{ node_major }}.*"
    file_type: directory
  register: node_installed_glob
  changed_when: false

- name: Install Node {{ node_major }} using NVM
  ansible.builtin.shell: |
    source {{ home }}/.nvm/nvm.sh
    nvm install {{ node_major }} --latest-npm
  args:
    executable: /bin/bash
  when: node_installed_glob.matched == 0

- name: Locate the installed Node {{ node_major }} directory
  ansible.builtin.find:
    paths: "{{ home }}/.nvm/versions/node/"
    patterns: "v{{ node_major }}.*"
    file_type: directory
  register: node_dir_glob
  changed_when: false

# Single stable path for every other task (skills.yml, etc.): ~/.local/node/bin.
# Re-running the playbook re-points it after a node_major bump; nothing else
# needs to know the concrete version.
- name: Symlink current Node into ~/.local/node
  ansible.builtin.file:
    src: "{{ node_dir_glob.files[0].path }}"
    dest: "{{ home }}/.local/node"
    state: link
    force: true

- name: Install pnpm
  ansible.builtin.shell: |
    curl -fsSL https://get.pnpm.io/install.sh | sh -
  args:
    executable: /bin/bash
    creates: "{{ home }}/.local/bin/pnpm"

- name: Install global packages with npm
  community.general.npm:
    name: "{{ item }}"
    global: true
    executable: "{{ home }}/.local/node/bin/npm"
  environment:
    PATH: "{{ home }}/.local/node/bin:{{ ansible_env.PATH }}"
  loop:
    - typescript
    - eslint
    - prettier
    - vite
    - "@alibaba-group/open-code-review"

- name: Change ownership of the .npm directory dynamically
  ansible.builtin.file:
    path: "{{ home }}/.npm"
    state: directory
    recurse: true
    owner: "{{ user }}"
    group: "{{ user }}"
