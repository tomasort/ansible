---
# Git diff pager (used by lazygit's config: `delta --dark --paging=never`).
# Macs (arm and Intel): brew's git-delta formula — upstream stopped shipping
# Intel-mac tarballs, so a pinned release can't cover both arches anymore.
# Linux: pinned GitHub tarball into ~/.local/bin, as before.

- name: Check if delta is already on PATH
  ansible.builtin.command:
    argv:
      - sh
      - -lc
      - command -v delta
  register: delta_on_path
  changed_when: false
  failed_when: false
  tags: [delta, minimal]

- name: Install delta with Homebrew
  community.general.homebrew:
    name: git-delta
    state: present
  when:
    - ansible_system == 'Darwin'
    - delta_on_path.rc != 0
  tags: [delta, minimal]

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ [home, '.local/bin'] | path_join }}"
    state: directory
    mode: "0755"
  when:
    - ansible_system != 'Darwin'
    - delta_on_path.rc != 0
  tags: [delta, minimal]

- name: Download delta from pinned GitHub release
  ansible.builtin.get_url:
    url: "https://github.com/dandavison/delta/releases/download/0.21.2/delta-0.21.2-x86_64-unknown-linux-gnu.tar.gz"
    dest: /tmp/delta.tar.gz
    mode: "0644"
  when:
    - ansible_system != 'Darwin'
    - delta_on_path.rc != 0
  tags: [delta, minimal]

- name: Extract delta tarball
  ansible.builtin.unarchive:
    src: /tmp/delta.tar.gz
    dest: /tmp
    remote_src: true
  when:
    - ansible_system != 'Darwin'
    - delta_on_path.rc != 0
  tags: [delta, minimal]

- name: Install delta binary into ~/.local/bin
  ansible.builtin.copy:
    src: "/tmp/delta-0.21.2-x86_64-unknown-linux-gnu/delta"
    dest: "{{ [home, '.local/bin/delta'] | path_join }}"
    mode: "0755"
    remote_src: true
  when:
    - ansible_system != 'Darwin'
    - delta_on_path.rc != 0
  tags: [delta, minimal]

- name: Clean up temp delta download
  ansible.builtin.file:
    path: /tmp/delta.tar.gz
    state: absent
  tags: [delta, minimal]
