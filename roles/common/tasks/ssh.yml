- name: Ensure .ssh directory exists.
  file:
    dest: "{{ [home, '.ssh'] | path_join }}"
    mode: 0750
    state: directory

- name: Install ssh key
  copy:
    src: "{{ key }}"
    dest: "{{ [home, key] | path_join }}"
    mode: 0600

- name: Install ssh key public
  copy:
    src: "{{ key }}.pub"
    dest: "{{ [home, key] | path_join }}.pub"
    mode: 0644

- name: Set authorized key took from file
  authorized_key:
    user: "{{ user }}"
    state: present
    key: "{{ lookup('file', [home, key + '.pub'] | path_join) }}"

- name: Ensure X11 forwarding is enabled on the client side
  ansible.builtin.lineinfile:
    path: /etc/ssh/ssh_config
    regexp: '^#?ForwardX11'
    insertafter: 'Host *'
    line: 'ForwardX11 yes'
    firstmatch: true
  become: true

- name: Ensure X11 forwarding is disabled for github.com
  ansible.builtin.blockinfile:
    path: /etc/ssh/ssh_config
    marker: "# {mark} ANSIBLE MANAGED BLOCK - GITHUB X11"
    block: |
      Host github.com
        ForwardX11 no
    insertbefore: '^Host \*'
  become: true
