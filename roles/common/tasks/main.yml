---
# tasks file for common

# Packages whose names are identical on apt and brew — every platform, one list.
- name: Install shared packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - zsh
    - stow
    - git
    - vim
    - curl
    - nmap
    - iftop
    - jq
    - gh
    - bat
    - ripgrep
    - composer
    - php
    - luarocks
    - maven
    - rlwrap # for cht.sh
    - git-lfs
    - neofetch
    - python3
    - lynx
    - zoxide
    - dnsmasq
    - btop
    - bmon
    - 7zip              # brew resolves this alias to sevenzip
    - moreutils
    - imagemagick
    - wget
    # npm deliberately omitted: apt's npm drags in distro nodejs (v18); nvm installs Node 22 in node.yml
    - tmux
    - tree
    - openvpn
    - cloc
    - httrack
    - pwgen
    - ffmpeg
    - hashcat
  become: "{{ ansible_os_family != 'Darwin' }}"
  tags: [packages, minimal, required]

# apt-only names (no brew formula, or the shared name means something different).
- name: Install Linux-only packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  when: ansible_os_family != 'Darwin'
  loop:
    - xclip
    - xsel # for cht.sh
    - default-jre       # apt meta-package; brew equivalent is openjdk (below)
    - default-jdk
    - python3-debugpy
    - poppler-utils
    - fd-find
  become: true
  tags: [packages]

# brew-only names (apt equivalent already covered in the Linux list above).
- name: Install macOS-only packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  when: ansible_os_family == 'Darwin'
  become: "{{ ansible_os_family != 'Darwin' }}"
  loop:
    - openjdk
    - fd
    - poppler
  tags: [packages, minimal, required]

- name: Install Go (tarball, any platform)
  ansible.builtin.import_tasks: "go.yml"
  tags: [go]

- name: Install tools that require Go
  ansible.builtin.import_tasks: "go_tools.yml"
  tags: [go-tools]

- name: Stow dotfiles
  ansible.builtin.import_tasks: "dotfiles.yml"
  tags: [dotfiles, minimal]

- name: Include nvim tasks
  ansible.builtin.import_tasks: "nvim.yml"
  tags: [nvim, minimal, vim, dotfiles]

- name: Include zsh tasks
  ansible.builtin.import_tasks: "zsh.yml"
  tags: [zsh, dotfiles, shell, minimal]

- name: Install ruby (toolchain, every platform)
  ansible.builtin.import_tasks: "ruby.yml"
  tags: [ruby]

- name: Install colorls (ruby-gem tool)
  ansible.builtin.import_tasks: "colorls.yml"
  tags: [colorls]

- name: Include git tasks
  ansible.builtin.import_tasks: "git.yml"
  tags: [dotfiles, git, minimal]

- name: Include node tasks
  ansible.builtin.import_tasks: "node.yml"
  tags: [node, minimal]

- name: Include agent skills setup (submodule + hyperframes)
  ansible.builtin.import_tasks: "skills.yml"
  tags: [skills, dotfiles]

- name: Include python tasks
  ansible.builtin.import_tasks: "python.yml"
  tags: [python]

- name: Include ssh tasks
  ansible.builtin.import_tasks: "ssh.yml"
  tags: [ssh, minimal]

- name: Include tmux tasks
  ansible.builtin.import_tasks: "tmux.yml"
  tags: [tmux, minimal, dotfiles]

- name: Include rust toolchain tasks
  ansible.builtin.import_tasks: "rust.yml"
  tags: [rust, minimal]

- name: Include cargo-built tools
  ansible.builtin.import_tasks: "rust_tools.yml"
  tags: [rust-tools]

- name: Include uv installation
  ansible.builtin.import_tasks: "uv.yml"
  tags: [uv, minimal]
